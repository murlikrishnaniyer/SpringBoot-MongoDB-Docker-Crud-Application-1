name: Build, Test, and Deploy to AWS ECS

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: springboot-mongodb-crud
  ECS_SERVICE: springboot-mongodb-crud-spring-service
  ECS_CLUSTER: springboot-mongodb-crud-cluster
  ECS_TASK_DEFINITION: springboot-mongodb-crud-spring-task
  CONTAINER_NAME: spring-app

jobs:
  # ==============================================================================
  # BUILD JOB
  # ==============================================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          ./mvnw clean package -DskipTests \
            -Dmaven.compiler.source=24 \
            -Dmaven.compiler.target=24

      - name: Run Unit Tests
        run: |
          ./mvnw test \
            -Dmaven.compiler.source=24 \
            -Dmaven.compiler.target=24

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: target/surefire-reports/*.xml
          check_name: Unit Test Results

      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella

  # ==============================================================================
  # SECURITY SCAN JOB
  # ==============================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # ==============================================================================
  # DOCKER BUILD & PUSH JOB
  # ==============================================================================
  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image-latest=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >> $GITHUB_OUTPUT

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Pushed images:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  # ==============================================================================
  # DEPLOY JOB
  # ==============================================================================
  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/master'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update ECS Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to Amazon ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Get ALB URL
        id: get-url
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names sbt-crud-alb \
            --region ${{ env.AWS_REGION }} \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          echo "alb_url=http://$ALB_DNS" >> $GITHUB_OUTPUT

      - name: Post Deployment Status
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Deployment Successful!\n\n**Application:** http://${{ steps.get-url.outputs.alb_url }}\n**Build:** ${{ github.sha }}\n**Environment:** AWS ECS (ap-south-2)`
            })

  # ==============================================================================
  # NOTIFICATION JOB
  # ==============================================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [build, security-scan, docker-build]
    if: always()

    steps:
      - name: Determine Status
        id: status
        run: |
          if [ "${{ needs.build.result }}" == "failure" ] || \
             [ "${{ needs.security-scan.result }}" == "failure" ] || \
             [ "${{ needs.docker-build.result }}" == "failure" ]; then
            echo "status=❌ FAILED"
          else
            echo "status=✅ SUCCESS"
          fi

      - name: Create Build Summary
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `
            ## CI/CD Pipeline Summary
            
            | Job | Status |
            |-----|--------|
            | Build & Test | ${{ needs.build.result }} |
            | Security Scan | ${{ needs.security-scan.result }} |
            | Docker Build | ${{ needs.docker-build.result }} |
            
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Triggered by:** ${{ github.actor }}
            `;
            
            core.summary.write(summary);
